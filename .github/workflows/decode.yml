name: Decode screenshots
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 screenshots
        run: |
          set -euo pipefail
          for f in *.b64; do
            [ -f "$f" ] || continue
            base64 -d "$f" > "${f%.b64}.png"
            file "${f%.b64}.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          if git diff --cached --quiet; then
            echo "no png changes"
          else
            git commit -m "Decode FLY-176 walkthrough PNGs"
            git push
          fi
